name: build

# Replaces the workflow inherited from upstream. Four things are worth knowing
# before editing this file.
#
# It no longer runs inside ballaswag/guppydev:latest. That is an unpinned image
# on an abandoned account, so it could change or disappear underneath us, and it
# carried a different toolchain from the one this repo develops against, which
# meant a green build here proved nothing about a local one.
#
# It calls scripts/build.sh rather than repeating the patch and make steps, so
# CI and a developer's machine cannot drift apart. Adding a build flag means
# editing the script, not this file.
#
# Nothing calls apt-get directly. The runner's mirrorlist puts the Azure Ubuntu
# mirror first and only fails over on a hard error, so when that mirror degrades
# a download trickles rather than failing, and apt's inactivity timeout never
# fires. That wedged nine jobs for hours in August 2026. scripts/ci-apt-install.sh
# bounds each attempt on wall clock time and drops the Azure mirror before
# retrying, and every job carries a timeout-minutes so a stall fails the run
# instead of sitting until the 360 minute default. Only the simulator needs apt
# at all now, for libsdl2-dev: both cross targets download a pinned toolchain
# rather than taking one from the runner image.
#
# A push to main that changes source and builds cleanly publishes its own
# release, tagged <date>-<sha>, so the release list is a build history rather
# than a single entry that keeps getting overwritten. Documentation-only pushes
# still build, they just do not publish. There is no separate stable track, so
# these are normal releases and the newest one is what releases/latest resolves
# to, which is what update.sh and the installers follow.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Works out the version once and decides whether this push earns a release.
  #
  # The version is shared rather than recomputed, because working it out in both
  # the build and release jobs races across UTC midnight and would tag a release
  # differently from the string compiled into the binary.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: pick
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Not published anywhere, and update.sh refuses to overwrite a
            # binary versioned this way.
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
            echo "pull request, building without publishing"
            exit 0
          fi

          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

          # A manual run always publishes. That is the escape hatch if the
          # filter below ever skips something it should not have.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "manual run, publishing"
            exit 0
          fi

          before='${{ github.event.before }}'
          if [ -z "$before" ] \
             || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "cannot tell what changed, publishing rather than silently skipping"
            exit 0
          fi

          changed=$(git diff --name-only "$before" "$GITHUB_SHA")
          echo "changed in this push:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Anything that is not documentation counts. Listing what to ignore
          # rather than what to build means an unrecognised path errs towards
          # publishing, which is the harmless direction. Note that installer.sh,
          # update.sh, k1/ and themes/ all ship inside the tarball, so they are
          # source as far as this is concerned.
          non_doc=$(printf '%s\n' "$changed" | grep -v '^$' \
            | grep -vE '\.md$|^docs/|^screenshots/|^LICENSE$' || true)

          if [ -n "$non_doc" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "source changed, publishing"
          else
            echo "release=false" >> $GITHUB_OUTPUT
            echo "documentation only, no release for this push"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mips
            theme: material
            small: false
            asset: guppyscreen
          - target: mips
            theme: zbolt
            small: false
            asset: guppyscreen-zbolt
          - target: mips
            theme: material
            small: true
            asset: guppyscreen-smallscreen
          - target: arm
            theme: material
            small: false
            asset: guppyscreen-arm

    runs-on: ubuntu-24.04
    # A healthy build is about four minutes. Without this the GitHub default of
    # 360 applies, which is how a stalled apt sat wedged for hours instead of
    # failing and letting the run be retried.
    timeout-minutes: 25
    env:
      GUPPYSCREEN_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # No apt here at all any more. Both cross targets download a pinned
      # toolchain, so the compiler that builds a release does not depend on
      # what the runner image happens to ship, and this job has one less chance
      # to wedge on a bad mirror. Only the simulator job still needs apt, for
      # libsdl2-dev.

      # setup-toolchain.sh caches the archive here, so a hit skips the download.
      # Keyed per target, since the two jobs fetch different archives.
      - name: cache toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/guppyscreen
          key: toolchain-${{ matrix.target }}-mips-2025.08-1-arm-14.3.rel1

      - name: fetch toolchain
        run: scripts/setup-toolchain.sh ${{ matrix.target }}

      - name: build
        run: |
          scripts/build.sh ${{ matrix.target }} ${{ matrix.theme }} \
            ${{ matrix.small && '--small' || '' }}

      # Guards the property that actually matters on the printer: the binary has
      # to be static, because the glibc version moves between Creality firmware
      # releases. A dynamically linked build would install and then fail to run.
      #
      # Checked for arm too. Its glibc argument is weaker, since that target is
      # Debian rather than a vendor firmware, but the Makefile links both the
      # same way and nothing was asserting it, so a toolchain change could turn
      # it dynamic without anyone noticing.
      - name: check the binary is static
        run: |
          if [ "${{ matrix.target }}" = "mips" ]; then
            readelf=toolchains/mips32el--musl--stable-2025.08-1/bin/mipsel-linux-readelf
          else
            arm=arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu
            readelf=toolchains/$arm/bin/aarch64-none-linux-gnu-readelf
          fi
          $readelf -h build/bin/guppyscreen | grep -E 'Class:|Machine:|Flags:'
          if $readelf -lW build/bin/guppyscreen | grep -qE '^\s+(INTERP|DYNAMIC)'; then
            echo "::error::${{ matrix.target }} binary is dynamically linked"
            exit 1
          fi

      # This step runs in a fresh shell, so everything scripts/build.sh exported
      # for the compile has to be set again. GUPPY_THEME goes into .version, and
      # CROSS_COMPILE picks the right strip and readelf. Without the latter,
      # release.sh silently ran the host strip and shipped an unstripped binary.
      - name: package
        env:
          GUPPY_THEME: ${{ matrix.theme }}
        run: |
          if [ "${{ matrix.target }}" = "mips" ]; then
            export PATH="$PWD/toolchains/mips32el--musl--stable-2025.08-1/bin:$PATH"
            export CROSS_COMPILE=mipsel-linux-
          else
            arm=arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu
            export PATH="$PWD/toolchains/$arm/bin:$PATH"
            export CROSS_COMPILE=aarch64-none-linux-gnu-
          fi
          chmod +x ./release.sh
          ./release.sh ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ./${{ matrix.asset }}.tar.gz

  simulator:
    # Builds what developers actually run, which the upstream matrix never did.
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # libsdl2-dev is the only thing the sim build needs that the image lacks.
      - name: install build dependencies
        run: scripts/ci-apt-install.sh libsdl2-dev

      - name: build
        run: scripts/build.sh sim

  # Published once, after the whole matrix and the simulator build have passed.
  # As a step inside the matrix, four parallel jobs race to create the same tag,
  # and a broken variant still produces a half populated release.
  release:
    needs: [ version, build, simulator ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Before download-artifact, not after. actions/checkout cleans the
      # workspace, so putting it second deletes the artifacts that have just
      # been downloaded and the upload then matches no files.
      #
      # Full history and tags, both needed to work out what has happened since
      # the last release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: dist

      # The notes list every commit since the previous release rather than the
      # ones in this push. Those are not the same set: a documentation-only
      # push builds without publishing, so keying off the push would drop its
      # commits from every release's notes, and they would appear nowhere.
      - id: changes
        run: |
          set -euo pipefail

          # Only our own release tags. The upstream history this repo carries
          # brings 0.0.x-beta tags with it, and describing against one of those
          # would produce a changelog going back to 2024.
          prev=$(git describe --tags --abbrev=0 \
                   --match '20[0-9][0-9].[0-9][0-9].[0-9][0-9]-*' \
                   HEAD 2>/dev/null || true)

          delim="CHANGES_$(openssl rand -hex 8)"
          repo="${{ github.repository }}"
          limit=50

          if [ -z "$prev" ]; then
            echo "no previous release tag, listing nothing"
            {
              echo "log<<$delim"
              echo "First release from this workflow."
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changelog range: $prev..HEAD"
          fmt="- %s ([\`%h\`](https://github.com/$repo/commit/%H))"
          total=$(git rev-list --no-merges --count "$prev..HEAD")

          {
            echo "log<<$delim"
            git log --no-merges --reverse --format="$fmt" -n "$limit" "$prev..HEAD"
            if [ "$total" -gt "$limit" ]; then
              echo
              echo "$((total - limit)) earlier commits are not listed. See the" \
                   "[full comparison](https://github.com/$repo/compare/$prev...${{ needs.version.outputs.version }})."
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            Built from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### Which file

            | Download | For |
            | --- | --- |
            | `guppyscreen.tar.gz` | K1 and K1 Max, Material icons |
            | `guppyscreen-zbolt.tar.gz` | K1 and K1 Max, Z-Bolt icons |
            | `guppyscreen-smallscreen.tar.gz` | Ender 3 V3 KE, Nebula Pad |
            | `guppyscreen-arm.tar.gz` | aarch64 boards such as a Pi or BTT Pad |

            ### Installing

            **Already running vibescreen.** Press Update in the settings panel,
            or over SSH:

            ```
            /usr/data/guppyscreen/update.sh
            ```

            **New install, or coming from the original guppyscreen.** Run the
            installer once over SSH:

            ```
            sh -c "$(wget --no-check-certificate -qO - https://raw.githubusercontent.com/${{ github.repository }}/main/installer.sh)"
            ```

            Append `-s zbolt` for the Z-Bolt icon set.

            The original guppyscreen's updater points at the upstream project,
            so running it will not pick this up. Use the installer to switch
            across; it keeps your existing `guppyconfig.json`.

            ### What changed

            ${{ steps.changes.outputs.log }}

permissions:
  contents: write
