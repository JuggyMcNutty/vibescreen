name: build

# Replaces the workflow inherited from upstream. Three things changed and are
# worth knowing before editing this file.
#
# It no longer runs inside ballaswag/guppydev:latest. That is an unpinned image
# on an abandoned account, so it could change or disappear underneath us, and it
# carried a different toolchain from the one this repo develops against, which
# meant a green build here proved nothing about a local one.
#
# It calls scripts/build.sh rather than repeating the patch and make steps, so
# CI and a developer's machine cannot drift apart. Adding a build flag means
# editing the script, not this file.
#
# It publishes one rolling release, replaced on every push to main. That is the
# only channel this project has, so it is a normal release rather than a
# prerelease: marking it a prerelease would leave the repo with no "latest"
# release at all and break the releases/latest URLs the installer uses.

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mips
            theme: material
            small: false
            asset: guppyscreen
          - target: mips
            theme: zbolt
            small: false
            asset: guppyscreen-zbolt
          - target: mips
            theme: material
            small: true
            asset: guppyscreen-smallscreen
          - target: arm
            theme: material
            small: false
            asset: guppyscreen-arm

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake
          if [ "${{ matrix.target }}" = "arm" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # setup-toolchain.sh caches the archive here, so a hit skips the download.
      - name: cache mips toolchain
        if: matrix.target == 'mips'
        uses: actions/cache@v5
        with:
          path: ~/.cache/guppyscreen
          key: mips32el-musl-stable-2025.08-1

      - name: fetch mips toolchain
        if: matrix.target == 'mips'
        run: scripts/setup-toolchain.sh

      # Two shapes, and update.sh keys off them. dev-<sha> marks something not
      # published anywhere, so it refuses to overwrite it. rolling-<sha> is a
      # published artifact and updates normally.
      - name: set version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "GUPPYSCREEN_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "GUPPYSCREEN_VERSION=rolling-${GITHUB_SHA::8}" >> $GITHUB_ENV
          else
            echo "GUPPYSCREEN_VERSION=dev-${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi

      - name: build
        run: |
          scripts/build.sh ${{ matrix.target }} ${{ matrix.theme }} \
            ${{ matrix.small && '--small' || '' }}

      # Guards the property that actually matters on the printer: the binary has
      # to be static, because the glibc version moves between Creality firmware
      # releases. A dynamically linked build would install and then fail to run.
      - name: check the mips binary is static
        if: matrix.target == 'mips'
        run: |
          readelf=toolchains/mips32el--musl--stable-2025.08-1/bin/mipsel-linux-readelf
          $readelf -h build/bin/guppyscreen | grep -E 'Class:|Machine:|Flags:'
          if $readelf -lW build/bin/guppyscreen | grep -qE '^\s+(INTERP|DYNAMIC)'; then
            echo "::error::mips binary is dynamically linked, it will not run on the printer"
            exit 1
          fi

      # GUPPY_THEME has to be set here too. scripts/build.sh exports it for the
      # compile, but release.sh runs in a fresh shell and writes it into
      # .version, which was coming out empty.
      - name: package
        env:
          GUPPY_THEME: ${{ matrix.theme }}
        run: |
          chmod +x ./release.sh
          ./release.sh ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ./${{ matrix.asset }}.tar.gz

      - name: tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  simulator:
    # Builds what developers actually run, which the upstream matrix never did.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libsdl2-dev

      - name: build
        run: scripts/build.sh sim

  # The rolling release, published once after everything has built. This is
  # the only channel we publish to, so it is what update.sh takes by default.
  #
  # Done as its own job rather than a step in the matrix because four parallel
  # jobs writing the same tag race each other to create it. It also means a
  # broken variant, or a broken simulator build, blocks the publish instead of
  # producing a half populated release.
  #
  # The tag stays 'rolling' while its contents change every push, so the tag
  # cannot identify a build. The release name carries rolling-<sha>, the same
  # string release.sh writes into .version, and that is what update.sh compares
  # against to decide whether you already have it.
  rolling:
    needs: [ build, simulator ]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist

      - name: name the build
        run: echo "GUPPYSCREEN_VERSION=rolling-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: ${{ env.GUPPYSCREEN_VERSION }}
          files: dist/**/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            Rolling build of `main`, replaced on every push. This is the only
            channel this project publishes; there is no separate stable track.
            Not tested on a printer before publishing.

            Built from ${{ github.sha }}.

            K1 and K1 Max want `guppyscreen.tar.gz`, or
            `guppyscreen-zbolt.tar.gz` for the Z-Bolt icon set. Smaller panels
            such as the Ender 3 V3 KE and Nebula Pad want
            `guppyscreen-smallscreen.tar.gz`. `guppyscreen-arm.tar.gz` is for
            aarch64 boards like a Pi or BTT Pad.

            To move an existing install onto this:

                /usr/data/guppyscreen/update.sh

            Locally built binaries are versioned `dev-<sha>` and will not be
            replaced without `--force`.

permissions:
  contents: write
