name: build

# Replaces the workflow inherited from upstream. Three things are worth knowing
# before editing this file.
#
# It no longer runs inside ballaswag/guppydev:latest. That is an unpinned image
# on an abandoned account, so it could change or disappear underneath us, and it
# carried a different toolchain from the one this repo develops against, which
# meant a green build here proved nothing about a local one.
#
# It calls scripts/build.sh rather than repeating the patch and make steps, so
# CI and a developer's machine cannot drift apart. Adding a build flag means
# editing the script, not this file.
#
# Every push to main that builds cleanly publishes its own release, tagged
# <date>-<sha>, so the release list is a build history rather than a single
# entry that keeps getting overwritten. There is no separate stable track, so
# these are normal releases and the newest one is what releases/latest resolves
# to, which is what update.sh and the installers follow.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Worked out once and shared, so the string compiled into the binary and
  # written into .version cannot disagree with the tag the release ends up
  # under. Computing it in both places races across UTC midnight.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          else
            # Not published anywhere, and update.sh refuses to overwrite a
            # binary versioned this way.
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mips
            theme: material
            small: false
            asset: guppyscreen
          - target: mips
            theme: zbolt
            small: false
            asset: guppyscreen-zbolt
          - target: mips
            theme: material
            small: true
            asset: guppyscreen-smallscreen
          - target: arm
            theme: material
            small: false
            asset: guppyscreen-arm

    runs-on: ubuntu-24.04
    env:
      GUPPYSCREEN_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake
          if [ "${{ matrix.target }}" = "arm" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # setup-toolchain.sh caches the archive here, so a hit skips the download.
      - name: cache mips toolchain
        if: matrix.target == 'mips'
        uses: actions/cache@v5
        with:
          path: ~/.cache/guppyscreen
          key: mips32el-musl-stable-2025.08-1

      - name: fetch mips toolchain
        if: matrix.target == 'mips'
        run: scripts/setup-toolchain.sh

      - name: build
        run: |
          scripts/build.sh ${{ matrix.target }} ${{ matrix.theme }} \
            ${{ matrix.small && '--small' || '' }}

      # Guards the property that actually matters on the printer: the binary has
      # to be static, because the glibc version moves between Creality firmware
      # releases. A dynamically linked build would install and then fail to run.
      - name: check the mips binary is static
        if: matrix.target == 'mips'
        run: |
          readelf=toolchains/mips32el--musl--stable-2025.08-1/bin/mipsel-linux-readelf
          $readelf -h build/bin/guppyscreen | grep -E 'Class:|Machine:|Flags:'
          if $readelf -lW build/bin/guppyscreen | grep -qE '^\s+(INTERP|DYNAMIC)'; then
            echo "::error::mips binary is dynamically linked, it will not run on the printer"
            exit 1
          fi

      # This step runs in a fresh shell, so everything scripts/build.sh exported
      # for the compile has to be set again. GUPPY_THEME goes into .version, and
      # CROSS_COMPILE picks the right strip and readelf. Without the latter,
      # release.sh silently ran the host strip and shipped an unstripped binary.
      - name: package
        env:
          GUPPY_THEME: ${{ matrix.theme }}
        run: |
          if [ "${{ matrix.target }}" = "mips" ]; then
            export PATH="$PWD/toolchains/mips32el--musl--stable-2025.08-1/bin:$PATH"
            export CROSS_COMPILE=mipsel-linux-
          else
            export CROSS_COMPILE=aarch64-linux-gnu-
          fi
          chmod +x ./release.sh
          ./release.sh ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ./${{ matrix.asset }}.tar.gz

  simulator:
    # Builds what developers actually run, which the upstream matrix never did.
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libsdl2-dev

      - name: build
        run: scripts/build.sh sim

  # Published once, after the whole matrix and the simulator build have passed.
  # As a step inside the matrix, four parallel jobs race to create the same tag,
  # and a broken variant still produces a half populated release.
  release:
    needs: [ version, build, simulator ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*.tar.gz
          fail_on_unmatched_files: true
          body: |
            Built from [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### Which file

            | Download | For |
            | --- | --- |
            | `guppyscreen.tar.gz` | K1 and K1 Max, Material icons |
            | `guppyscreen-zbolt.tar.gz` | K1 and K1 Max, Z-Bolt icons |
            | `guppyscreen-smallscreen.tar.gz` | Ender 3 V3 KE, Nebula Pad |
            | `guppyscreen-arm.tar.gz` | aarch64 boards such as a Pi or BTT Pad |

            ### Installing

            **Already running vibescreen.** Press Update in the settings panel,
            or over SSH:

            ```
            /usr/data/guppyscreen/update.sh
            ```

            **New install, or coming from the original guppyscreen.** Run the
            installer once over SSH:

            ```
            sh -c "$(wget --no-check-certificate -qO - https://raw.githubusercontent.com/${{ github.repository }}/main/installer.sh)"
            ```

            Append `-s zbolt` for the Z-Bolt icon set.

            The original guppyscreen's updater points at the upstream project,
            so running it will not pick this up. Use the installer to switch
            across; it keeps your existing `guppyconfig.json`.

permissions:
  contents: write
